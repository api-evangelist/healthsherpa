aid: healthsherpa
name: HealthSherpa
description: >-
  HealthSherpa is the leading ACA (Affordable Care Act) health insurance quoting and enrollment
  platform, and was the first company to partner with CMS to offer Enhanced Direct Enrollment (EDE)
  for agents. Its developer surface, HealthSherpa ONE (one.healthsherpa.com), exposes a public
  OpenAPI 3.1 REST API for on- and off-exchange ACA plan quoting, county/issuer/provider reference
  lookups, agent and self-service enrollment sessions, and an approval-gated direct enrollment API
  covering the full off-exchange (ICHRA) application lifecycle — create, update, submit, cancel,
  terminate, supporting-document upload, and payment redirect. Authentication is a single x-api-key
  header; enrollment writes support Idempotency-Key with 24-hour retention. Separate ICHRA and
  Medicare Partner APIs provide QuoteConnect/EnrollConnect, deeplinked enrollment, and webhooks.
  HealthSherpa publishes first-party Agent Skills, an llms.txt, and vibe-coding prompts for agents.
