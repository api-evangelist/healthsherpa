format: healthsherpa-error-envelope
envelope:
  # Most HealthSherpa-owned + edge (API Gateway / WAF) failures use the unified `ErrorResponse`.
  unified: '{ "error": { "code": string, "message": string, "details"?: object } }'
  # Direct enrollment (/v1/enrollments*) service failures instead return a top-level errors[] array.
  direct_enrollment: '{ "errors": [ { "code": string, "message": string, "field"?: string } ] }'
  notes: >-
    Not RFC 9457 (no application/problem+json). Clients should switch on error.code (or errors[].code),
    treated as a stable programmatic identifier, and not parse `message`. Edge-generated failures on the
    direct enrollment endpoints (missing/invalid API key) still use the unified `error` envelope.
problems:
